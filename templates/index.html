<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Face Recognition App</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    header {
      background: #007BFF;
      color: #fff;
      padding: 20px 0;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, .1);
    }

    header h1 { margin: 0; font-weight: 700; }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, .08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: all .4s ease;
    }

    .container.show-result {
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
    }

    .col { padding: 10px; width: 100%; }
    .left { flex: 0 0 42%; text-align: center; }
    .right {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .container.show-result .right { display: flex; 
	 padding-top: 50px; }

    input[type="file"] { display: none; }
    .custom-file-upload {
      border: 2px dashed #007BFF;
      display: inline-block;
      padding: 14px 22px;
      cursor: pointer;
      border-radius: 10px;
      color: #007BFF;
      font-weight: 500;
      transition: all .2s;
      background: #fff;
    }
    .custom-file-upload:hover { background: #007BFF; color: #fff; }

    .img-box {
      width: 100%;
      height: 360px;
      border-radius: 10px;
      border: 1px solid #eee;
      background: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,.06);
      margin-top: 14px;
    }

    .img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    button {
      margin-top: 14px;
      padding: 12px 18px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: #007BFF;
      color: #fff;
      cursor: pointer;
      transition: all .2s;
    }
    button:hover:enabled { background: #0056b3; }
    button:disabled {
      background: #bcd3ff;
      cursor: not-allowed;
    }

    .pred-block {
      width: 100%;
      text-align: center;
      padding: 10px;
      box-sizing: border-box;
      background: #fff;
      border-radius: 6px;
    }
    .pred-name {
      font-weight: 700;
      margin-bottom: 6px;
      color: #111;
      font-size: 16px;
    }
    .pred-confidence {
      color: #555;
      font-size: 14px;
	  font-weight: 900;
    }

    .spinner { display: none; margin-top: 12px; }

    @media (max-width: 900px) {
      .container.show-result { flex-direction: column; }
      .left, .right { width: 100%; text-align: center; }
    }
  </style>
</head>

<body>
  <header><h1>Face Recognition App</h1></header>

  <div class="container" id="mainContainer">
    <!-- LEFT SECTION -->
    <div class="col left">
      <h3 style="margin-top:0">Upload an Image</h3>
      <label class="custom-file-upload">
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
        Choose Image
      </label>

      <!-- image preview -->
      <div class="img-box" id="previewBox">
        <img id="imagePreview" alt="preview" />
      </div>

      <div>
        <button id="submitBtn" onclick="submitImage()" disabled>Recognize Face</button>
      </div>

      <div class="spinner" id="spinner">
        <img src="/static/spinner1.gif" alt="Loading..." style="width:40px;height:40px;">
      </div>
    </div>

    <!-- RIGHT SECTION -->
    <div class="col right" id="resultSection">
	 <h3 style="margin-top:0">Prediction Result</h3>
      <div class="img-box" id="outputBox">
        <img id="outputImage" alt="annotated result" />
      </div>

      <div class="pred-block" id="recognitionResult"></div>
    </div>
  </div>

  <script>
    function previewImage(event) {
      const file = event.target.files[0];
      const preview = document.getElementById('imagePreview');
      const previewBox = document.getElementById('previewBox');
      const submitBtn = document.getElementById('submitBtn');

      if (!file) {
        preview.src = '';
        previewBox.style.display = 'none';
        submitBtn.disabled = true;
        return;
      }

      const url = URL.createObjectURL(file);
      preview.src = url;
      previewBox.style.display = 'flex';
      submitBtn.disabled = false;
    }

    async function submitImage() {
      const input = document.getElementById('imageInput');
      const file = input.files[0];
      const resultDiv = document.getElementById('recognitionResult');
      const outputImage = document.getElementById('outputImage');
      const spinner = document.getElementById('spinner');
      const submitBtn = document.getElementById('submitBtn');
      const container = document.getElementById('mainContainer');
      const resultSection = document.getElementById('resultSection');

      resultDiv.innerHTML = '';
      outputImage.src = '';
      outputImage.style.display = 'none';
      resultSection.style.display = 'none';
      container.classList.remove('show-result');

      if (!file) return;

      spinner.style.display = 'block';
      submitBtn.disabled = true;

      try {
        const formData = new FormData();
        formData.append('image', file);
        const res = await fetch('/predict', { method: 'POST', body: formData });
        const data = await res.json();

        spinner.style.display = 'none';
        submitBtn.disabled = false;

        if (data.error) {
          alert(`Error: ${data.error}`);
          return;
        }

        if (data.annotated_image_path) {
          const ts = Date.now();
          outputImage.src = `${data.annotated_image_path}?t=${ts}`;
          outputImage.style.display = 'block';
          document.getElementById('outputBox').style.display = 'flex';
        }

        if (Array.isArray(data.predictions) && data.predictions.length > 0) {
          const html = data.predictions.map((p, i) => {
            const nameHtml = `<div class="pred-name"> ${escapeHtml(p.name)}</div>`;
            const confHtml = `<div class="pred-confidence">Confidence: ${Number((p.confidence || 0)).toFixed(2)}</div>`;
            return `<div style="margin-bottom:10px">${nameHtml}${confHtml}</div>`;
          }).join('');
          resultDiv.innerHTML = html;
        } else {
          resultDiv.innerHTML = '<div class="pred-name">No faces detected.</div>';
        }

        container.classList.add('show-result');
        resultSection.style.display = 'flex';

      } catch (err) {
        console.error(err);
        spinner.style.display = 'none';
        submitBtn.disabled = false;
        alert('Error occurred while processing.');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
